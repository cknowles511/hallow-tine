<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">

    <title>Hallow-Tine 🖤</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- SCREEN ONE -->

        <section id="question-screen" class="screen">

            <div class="question">
                <p>WILL YOU</p>
                <p>BE MY</p>
                <h1>HALLOW-TINE?</h1>
            </div>

            <div class="buttons">
                <button id="yes-button">YES</button>
                <button id="no-button">NO</button>
            </div>

            <img
                src="skeleton-hand.png"
                class="grave-art"
                alt="Skeleton hand rising from the ground"
            >

        </section>


        <!-- SCREEN TWO -->

        <section id="date-screen" class="screen hidden">

            <div class="date-content">

                <p class="save-text">
                    SAVE THE DATE
                </p>

                <h2>
                    10/16 – 10/18
                </h2>

                <div class="heart-container">

                    <div class="heart">
                        ♡
                    </div>

                </div>

                <p class="see-you">
                    SEE YOU THERE 🖤
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
